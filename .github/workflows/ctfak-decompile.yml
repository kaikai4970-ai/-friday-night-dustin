name: ctfak-decompile
on:
  push:
    paths:
      - ".github/workflows/ctfak-decompile.yml"
  workflow_dispatch:
    inputs:
      exe_url:
        default: "https://github.com/kaikai4970-ai/-friday-night-dustin/releases/download/dustin/dtge-v0.1.4.exe"
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: download
        run: curl -L -o game.exe "${{ inputs.exe_url || 'https://github.com/kaikai4970-ai/-friday-night-dustin/releases/download/dustin/dtge-v0.1.4.exe' }}"
      - name: inspect
        shell: python
        run: |
          import struct, re
          d = open("game.exe", "rb").read()
          print("size:", len(d))

          pe = struct.unpack_from("<I", d, 0x3C)[0]
          nsec = struct.unpack_from("<H", d, pe + 6)[0]
          optsz = struct.unpack_from("<H", d, pe + 20)[0]
          sec = pe + 24 + optsz
          end = 0
          for i in range(nsec):
              n, vs, va, rs, ro = struct.unpack_from("<8sIIII", d, sec + i * 40)
              print("section", n.rstrip(b"\0").decode(), "raw_off", hex(ro), "raw_size", hex(rs))
              end = max(end, ro + rs)
          print("PE end (overlay start):", hex(end), "overlay size:", len(d) - end)

          for sig in (b"PAME", b"PAMU", b"CRUF"):
              pos = [m.start() for m in re.finditer(sig, d)]
              print(sig.decode(), "count", len(pos), "first", [hex(p) for p in pos[:5]])

          print("overlay head:", d[end:end + 64].hex(" "))

          for base in [m.start() for m in re.finditer(b"PAMU", d)]:
              print("=== PAMU at", hex(base), "===")
              print("head:", d[base:base + 48].hex(" "))
              for skip in (4, 8, 12, 16, 20, 24):
                  q = base + skip
                  ok = 0
                  for _ in range(30):
                      if q + 8 > len(d): break
                      cid, flag, size = struct.unpack_from("<HHi", d, q)
                      if size < 0 or q + 8 + size > len(d): break
                      ok += 1
                      q += 8 + size
                  print("skip", skip, "-> chunks parsed:", ok)

          print("tail:", d[-32:].hex(" "))
          for m in list(re.finditer(rb"[ -~]{6,}\.(dll|ccn|dat)", d[end:end + 4000000]))[:30]:
              print("str:", m.group().decode(errors="ignore"))
