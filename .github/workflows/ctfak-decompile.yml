name: ctfak-decompile
on:
  push:
    paths:
      - ".github/workflows/ctfak-decompile.yml"
  workflow_dispatch:
    inputs:
      tool_index:
        description: "CTFAK tool number (0 = list tools and exit)"
        default: "0"
      exe_url:
        default: "https://github.com/kaikai4970-ai/-friday-night-dustin/releases/download/dustin/dtge-v0.1.4.exe"
jobs:
  run:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
      - name: clone
        shell: pwsh
        run: git clone --depth 1 https://github.com/CTFAK/CTFAK2.0 ctfak
      - name: patch (console-less CI)
        shell: pwsh
        run: |
          # CLI配下の全 .cs でコンソール系の例外を握りつぶす
          Get-ChildItem ctfak/Interface/CTFAK.Cli -Recurse -Filter *.cs | ForEach-Object {
            $c = Get-Content $_.FullName -Raw
            $o = $c
            $c = $c -replace 'ASCIIArt\.DrawArt2\(\)\s*;', 'try { ASCIIArt.DrawArt2(); } catch { }'
            $c = $c -replace 'Console\.Clear\(\)\s*;', 'try { Console.Clear(); } catch { }'
            $c = $c -replace 'Console\.WindowWidth',  '(Console.IsOutputRedirected || Console.IsInputRedirected ? 120 : Console.WindowWidth)'
            $c = $c -replace 'Console\.WindowHeight', '(Console.IsOutputRedirected || Console.IsInputRedirected ? 30 : Console.WindowHeight)'
            $c = $c -replace 'Console\.SetCursorPosition\(([^;]*)\)\s*;', 'try { Console.SetCursorPosition($1); } catch { }'
            if ($c -ne $o) { Set-Content $_.FullName $c; Write-Host "patched $($_.Name)" }
          }
          Select-String -Path ctfak/Interface/CTFAK.Cli/*.cs -Pattern 'Console\.(Clear|ReadKey|CursorVisible|SetCursor)'
      - name: build
        shell: pwsh
        run: |
          cd ctfak
          dotnet build Interface/CTFAK.Cli/CTFAK.Cli.csproj -c Release -p:EnableWindowsTargeting=true
          Get-ChildItem Plugins -Filter *.csproj -Recurse | ForEach-Object { dotnet build $_.FullName -c Release -p:EnableWindowsTargeting=true }
      - name: stage
        shell: pwsh
        run: |
          $out = (Get-ChildItem ctfak/Interface/CTFAK.Cli/bin -Recurse -Filter CTFAK.Cli.exe | Select-Object -First 1).DirectoryName
          "OUT=$out" | Out-File -Append $env:GITHUB_ENV
          New-Item -ItemType Directory -Force "$out/Plugins" | Out-Null
          Get-ChildItem ctfak/Plugins -Recurse -Include Dumper.dll,CTFAK.Decompiler.dll | Where-Object { $_.FullName -match "Release" } | Copy-Item -Destination "$out/Plugins" -Force
          $t = Get-ChildItem ctfak -Recurse -Filter template.mfa | Select-Object -First 1
          if ($t) { Copy-Item $t.FullName "$out/template.mfa" -Force }

          # zlibwapi.dll (Joveler.Compression.ZLib のネイティブDLL) を x64\ に配置
          $searchRoots = @("ctfak", "$env:USERPROFILE\.nuget\packages\joveler.compression.zlib") | Where-Object { Test-Path $_ }
          $zlibs = Get-ChildItem $searchRoots -Recurse -Filter zlibwapi.dll -ErrorAction SilentlyContinue
          Write-Host "Found zlibwapi.dll candidates:"
          $zlibs | ForEach-Object { Write-Host "  $($_.FullName)" }
          $zlib = $zlibs | Where-Object { $_.FullName -match 'win-x64|[\\/]x64[\\/]' } | Select-Object -First 1
          if (-not $zlib) { $zlib = $zlibs | Select-Object -First 1 }
          if (-not $zlib) { throw "zlibwapi.dll not found" }
          New-Item -ItemType Directory -Force "$out/x64" | Out-Null
          Copy-Item $zlib.FullName "$out/x64/zlibwapi.dll" -Force
          Copy-Item $zlib.FullName "$out/zlibwapi.dll" -Force

          Invoke-WebRequest "${{ inputs.exe_url || 'https://github.com/kaikai4970-ai/-friday-night-dustin/releases/download/dustin/dtge-v0.1.4.exe' }}" -OutFile "$out/game.exe"
      - name: run
        shell: pwsh
        run: |
          cd $env:OUT
          "${{ inputs.tool_index || '0' }}" | .\CTFAK.Cli.exe -path game.exe -parameters "" 2>&1 | Tee-Object run.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ctfak-output
          path: |
            ${{ env.OUT }}/Dumps/**
            ${{ env.OUT }}/*.mfa
            ${{ env.OUT }}/run.log
